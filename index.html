<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Уборка на Луне</title>
    <link rel="icon" type="image/webp" href="assets/ui/ic_sparkle.webp">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #222;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        input, textarea, [contenteditable] { -webkit-user-select: text; user-select: text; }
        img { -webkit-user-drag: none; }
        #world3d {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            touch-action: none;
        }
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background: radial-gradient(120% 90% at 50% 100%, #2a2f86 0%, #141a3a 46%, #070a1e 100%);
            z-index: 1000;
        }
        @font-face {
            font-family: 'Rubik';
            src: url('assets/fonts/rubik.ttf?v=0.1.4-4165cf22') format('truetype');
            font-weight: 300 900;
            font-display: swap;
        }
        .loading-text {
            font: 700 15px 'Rubik', system-ui, sans-serif;
            color: #c9d2ff;
            text-align: center;
            min-height: 1em;
        }
        .loading-bar {
            width: min(320px, 74vw);
            height: 22px;
            background: #0b0f2a;
            border: 4px solid #10142e;
            box-shadow: 0 4px 0 #05071a, inset 0 2px 0 rgba(255,255,255,.08);
            border-radius: 14px;
            overflow: hidden;
        }
        .loading-progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(#9dff7a, #23c552);
            box-shadow: inset 0 3px 0 rgba(255,255,255,.45);
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        #loading-title { margin: 0; font: 900 clamp(18px, 3.6vw, 28px)/1.15 'Rubik', system-ui, sans-serif; color: #fff; text-align: center; max-width: 86vw; -webkit-text-stroke: 5px #10142e; paint-order: stroke fill; text-shadow: 0 3px 0 #10142e; }
        .game-logo { width: min(440px, 78vw); max-height: 38vh; object-fit: contain; }
        #loading-percent { font: 900 20px 'Rubik', system-ui, sans-serif; color: #ffd21f; -webkit-text-stroke: 4px #10142e; paint-order: stroke fill; }
        #loading-retry { padding: 12px 26px; border: 4px solid #10142e; border-radius: 16px; background: linear-gradient(#9dff7a, #23c552); box-shadow: 0 5px 0 #0e7a2f; color: #fff; font: 900 18px 'Rubik', system-ui, sans-serif; -webkit-text-stroke: 4px #10142e; paint-order: stroke fill; cursor: pointer; }
    </style>
</head>
<body>
    <canvas id="world3d"></canvas>
    <div id="loading-screen" role="status" aria-busy="true" aria-live="polite">
        <img class="game-logo" src="assets/ui/logo-pikabu.webp" alt="" aria-hidden="true">
        <h1 id="loading-title">Уборка на Луне</h1>
        <div id="loading-percent">0%</div>
        <div class="loading-bar" id="loading-meter" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="loading-progress"></div></div>
        <div class="loading-text" data-t="loading">Загрузка…</div>
        <button id="loading-retry" type="button" hidden></button>
    </div>

    <!-- Порядок значим: Constants.js первым (остальные читают его глобалы), main.js последним -->
    <script src="https://games.pikabu.ru/sdk/sdk.js"></script>
<script src="js/Constants.js?v=0.1.4-4165cf22"></script>
    <!-- 1.40 ads-ui: поле игры на десктопе не шире 2:1 (Playgama); вторым — его resize идёт раньше обработчиков движка -->
    <script src="js/ViewCap.js?v=0.1.4-4165cf22"></script>
    <script src="libs/simplex-noise.js?v=0.1.4-4165cf22"></script>
    <script src="libs/babylon.js?v=0.1.4-4165cf22"></script>
    <script src="js/Maps.js?v=0.1.4-4165cf22"></script>
    <script src="js/Maps2D.js?v=0.1.4-4165cf22"></script>
    <script src="js/World2D.js?v=0.1.4-4165cf22"></script>
    <script src="js/World3D.js?v=0.1.4-4165cf22"></script>
    <script src="js/Terrain3D.js?v=0.1.4-4165cf22"></script>
    <script src="js/CameraControl.js?v=0.1.4-4165cf22"></script>
    <!-- 1.40: камера не заслоняется сценой (столкновение, полупрозрачные заслоны) -->
    <script src="js/CameraSight.js?v=0.1.4-4165cf22"></script>
    <script src="js/Model3D.js?v=0.1.4-4165cf22"></script>
    <script src="js/ModelFBX.js?v=0.1.4-4165cf22"></script>
    <script src="js/ModelOBJ.js?v=0.1.4-4165cf22"></script>
    <script src="js/ModelGLTF.js?v=0.1.4-4165cf22"></script>
    <script src="js/Location3D.js?v=0.1.4-4165cf22"></script>
    <!-- world-a: Rig.js (риги и клипы), Nav.js (коллизии, высоты, пути) -->
    <script src="js/Rig.js?v=0.1.4-4165cf22"></script>
    <script src="js/Nav.js?v=0.1.4-4165cf22"></script>
    <!-- 1.30 мир (world-b): уровни графики и время суток -->
    <script src="js/Quality.js?v=0.1.4-4165cf22"></script>
    <script src="js/Sky3D.js?v=0.1.4-4165cf22"></script>
    <script src="js/Pause.js?v=0.1.4-4165cf22"></script>
    <script src="js/Sound.js?v=0.1.4-4165cf22"></script>
    <script src="js/Lang.js?v=0.1.4-4165cf22"></script>
    <script src="js/Platform.js?v=0.1.4-4165cf22"></script>
    <!-- Адаптеры площадок (Platform.register): Playgama; игра добавляет свои здесь же, после Platform.js -->
    <script src="js/PlatformPlaygama.js?v=0.1.4-4165cf22"></script>
    <!-- Адаптеры Telegram Mini App, CrazyGames, Android-обёртки и сборки test (detect() выбирает площадку) -->
    <script src="js/PlatformTelegram.js?v=0.1.4-4165cf22"></script>
    <script src="js/PlatformCrazy.js?v=0.1.4-4165cf22"></script>
    <script src="js/PlatformPikabu.js?v=0.1.4-4165cf22"></script>
    <script src="js/PlatformAndroid.js?v=0.1.4-4165cf22"></script>
    <script src="js/PlatformTest.js?v=0.1.4-4165cf22"></script>
    <script src="js/LoadingScreen.js?v=0.1.4-4165cf22"></script>
    <script src="js/ParticleFX.js?v=0.1.4-4165cf22"></script>
    <script src="js/Telemetry.js?v=0.1.4-4165cf22"></script>
    <!-- 1.30 systems-b: магазин косметики, Daily Gift, колесо фортуны (логика без UI, опт-ин: Shop/DailyGift/Wheel.init в Game.js) -->
    <script src="js/Shop.js?v=0.1.4-4165cf22"></script>
    <script src="js/DailyGift.js?v=0.1.4-4165cf22"></script>
    <script src="js/Wheel.js?v=0.1.4-4165cf22"></script>
    <!-- 1.30 systems-a: ввод, раскладка HUD, обучение. Opt-in: игра сама зовёт Input.init / HudLayout.init / Tutorial.init -->
    <script src="js/HudLayout.js?v=0.1.4-4165cf22"></script>
    <script src="js/Input.js?v=0.1.4-4165cf22"></script>
    <script src="js/Tutorial.js?v=0.1.4-4165cf22"></script>
    <script src="js/LiveWater3D.js?v=0.1.4-4165cf22"></script>
    <!-- 1.40 motion: физический блочный персонаж (opt-in). Порядок значим: MotionMath (GM) -> Humanoid -> MotionMatch -> CharacterPhysics -> Ragdoll -> Character -->
    <script src="js/MotionMath.js?v=0.1.4-4165cf22"></script>
    <script src="js/Humanoid.js?v=0.1.4-4165cf22"></script>
    <script src="js/MotionMatch.js?v=0.1.4-4165cf22"></script>
    <script src="js/CharacterPhysics.js?v=0.1.4-4165cf22"></script>
    <script src="js/Ragdoll.js?v=0.1.4-4165cf22"></script>
    <script src="js/Character.js?v=0.1.4-4165cf22"></script>
    <!-- 1.40 obby (ветка obby): трасса из деталей карты, тело героя, боты и их чат, вид. Опт-ин: игра сама зовёт ObbyCourse.build / ObbyBots.init -->
    <script src="js/ObbyCourse.js?v=0.1.4-4165cf22"></script>
    <script src="js/ObbyBody.js?v=0.1.4-4165cf22"></script>
    <script src="js/ObbyChat.js?v=0.1.4-4165cf22"></script>
    <script src="js/ObbyBots.js?v=0.1.4-4165cf22"></script>
    <script src="js/ObbyCourseView.js?v=0.1.4-4165cf22"></script>
    <script src="js/ObbyAvatar.js?v=0.1.4-4165cf22"></script>
    <!-- Скрипты игры (js/Game.js и её модули) — здесь, до main.js -->
    <script src="js/GameData.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameDirt.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameHero.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameWorld.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameMobs.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameAudio.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameHud.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameFx.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameShopData.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameLook.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameShopUI.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameMetaUI.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameNpc.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameLeadersUI.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameCodex.js?v=0.1.4-4165cf22"></script>
    <script src="js/GameCodexUI.js?v=0.1.4-4165cf22"></script>
    <script src="js/Game.js?v=0.1.4-4165cf22"></script>
    <script src="js/PikabuShop.js?v=0.1.4-4165cf22"></script>
    <script src="js/PikabuPacks.js?v=0.1.4-4165cf22"></script>
    <script src="js/main.js?v=0.1.4-4165cf22"></script>
    <script>
        // Игровая область: долгий тап и ПКМ не открывают меню браузера, картинки не
        // тянутся, текст не выделяется — кроме настоящих полей ввода.
        (() => {
            const isField = t => t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
            for (const type of ['contextmenu', 'dragstart', 'selectstart']) {
                document.addEventListener(type, e => { if (!isField(e.target)) e.preventDefault(); });
            }
        })();
    </script>
</body>
</html>
